server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/repos;
    autoindex off;

    # ── IP réelle du client derrière le proxy TLS ────────────────────────────
    # Quand les dépôts sont servis à travers nginx-proxy ou Traefik (:443),
    # $remote_addr vaut l'adresse du conteneur proxy. downloads.log alimente
    # les statistiques de téléchargement, qui comptent les clients uniques sur
    # cette adresse : sans ceci, tous les téléchargements passant par le proxy
    # se confondent en un seul client. Les plages sont celles déjà retenues
    # pour TRUSTED_PROXIES côté backend (docker-compose.yaml).
    # Conséquence assumée : une machine du réseau privé peut fausser les
    # statistiques en forgeant X-Forwarded-For. Ces dépôts sont publics en
    # lecture, aucune décision d'autorisation ne dépend de cette adresse.
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Expose correctement le dépôt APT avec le bon chemin
    location /repos/ {
        root /usr/share/nginx/html/;
        autoindex off;
    }

    # Dépôt APK Alpine Linux
    # apk add --repository https://repod.example.com/apk/alpine3.20/main
    # → cherche : /apk/alpine3.20/main/x86_64/APKINDEX.tar.gz
    location /apk/ {
        root /usr/share/nginx/html/;
        autoindex off;

        # Pas de mise en cache pour APKINDEX (mis à jour à chaque upload)
        location ~* APKINDEX\.tar\.gz$ {
            root /usr/share/nginx/html/;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Log des téléchargements .apk
        location ~* \.apk$ {
            root /usr/share/nginx/html/;
            access_log /var/log/nginx/downloads.log main;
        }
    }

    # Téléchargements .deb — log dédié pour statistiques
    location ~* \.deb$ {
        root /usr/share/nginx/html/;
        access_log /var/log/nginx/downloads.log main;
    }

    # Téléchargements .rpm
    location ~* \.rpm$ {
        root /usr/share/nginx/html/;
        access_log /var/log/nginx/downloads.log main;
    }

    # Bloquer l'accès aux fichiers internes de reprepro
    location ~ /repos/.*/conf {
        deny all;
    }

    location ~ /repos/.*/db {
        deny all;
    }

    # Idem à la racine (root = /usr/share/nginx/html/repos, donc /conf/ et /db/
    # pointent directement vers les dossiers internes de reprepro)
    location ~ ^/(conf|db)(/|$) {
        deny all;
    }
}
